<!-- poe2db: 単一ファイル UI（docs/SPEC.md §8）。build_web.py がデータとパッチ番号を差し込む -->
<style>
/* 暗（既定）と明の 2 テーマ。色は変数だけで切り替える */
:root{
  /* 設定ウィンドウ（⚙）が上書きするサイズ。既定値はここ */
  --fs:14px;        /* 本文の基準サイズ */
  --ico:64px;       /* 一覧のアイコン */
  --ico-sm:38px;    /* スキル表のアイコン */
  --app-w:1180px;   /* 表示幅 */
  --fs-lg:calc(var(--fs) + 2px);
  --fs-s:calc(var(--fs) - 1px);
  --fs-ss:calc(var(--fs) - 1.5px);
  --fs-xs:calc(var(--fs) - 2px);
  --fs-xxs:calc(var(--fs) - 2.5px);
  --fs-3xs:calc(var(--fs) - 3px);
  --fs-badge:calc(var(--fs) - 3.5px);
  --bg:#12131a; --panel:#1a1c26; --panel2:#21242f; --line:#2c3040;
  --fg:#e6e8f0; --dim:#9aa0b4; --dim2:#6e7489;
  --accent:#c8a45c; --accent2:#7aa2f7; --hit:#f0c674;
  --unique:#c8a45c; --notable:#8fd3a0; --keystone:#e8d48a; --ascendancy:#c99bf0;
  --mod:#7aa2f7; --socketable:#e59a5c; --gem:#5fd0d0; --timeless:#e57a9a;
  --keyword:#a8b0c4;
  --stat:#c4c8d8; --imp:#9fb6d8; --imp-dot:#6d86ad;
  --shead-bg:#171922; --ico-bg:#0d0e14; --mark-bg:#4a3c14;
  --hw-bg:#3a2c18; --hw-fg:#f0c674; --hw-line:#5a4520;
  --cult-bg:#33203a; --cult-fg:#e0a0f0; --cult-line:#54305e;
  --vaal-bg:#3a1f2a; --vaal-fg:#f090a8; --vaal-line:#5e3040;
  --on-fg:#1a1a1a; --row-line:#20222c;
  /* 検索部は一覧と地続きに見えないよう、独立した帯として色を分ける */
  --head-bg:#090a11; --head-line:#3f465f;
}
:root[data-theme="light"]{
  --bg:#f6f7fa; --panel:#ffffff; --panel2:#e9ecf3; --line:#ccd1dd;
  --fg:#191c24; --dim:#4c5464; --dim2:#6d7485;
  --accent:#8a6410; --accent2:#2350a8; --hit:#6b4c00;
  --unique:#8a6410; --notable:#1d6b3e; --keystone:#7a5f10; --ascendancy:#6b3a9c;
  --mod:#2350a8; --socketable:#9a5410; --gem:#146a6a; --timeless:#a52a55;
  --keyword:#465064;
  --stat:#21252e; --imp:#28456e; --imp-dot:#5d7ba8;
  --shead-bg:#e5e9f1; --mark-bg:#ffe9a8;
  /* アイテム画像はゲーム内の暗い背景を前提に描かれているので、明テーマでも暗いまま置く */
  --ico-bg:#23262f;
  --hw-bg:#fdf0d4; --hw-fg:#6b4c00; --hw-line:#d9bb6e;
  --cult-bg:#f6e6fb; --cult-fg:#6b2d85; --cult-line:#cfa6de;
  --vaal-bg:#fde6ec; --vaal-fg:#8f2144; --vaal-line:#e3a8bc;
  --on-fg:#ffffff; --row-line:#e3e6ee;
  --head-bg:#d8dee9; --head-line:#98a2b8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:var(--fs)/1.55 "Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif}
a{color:var(--accent2)}
#app{max-width:var(--app-w);margin:0 auto;padding:0 16px 80px}

/* 検索部は普段は畳んで結果に場所を譲る。ホバー / 入力中 / 絞り込み操作中は開く。
   畳んでいる間も「今どう絞られているか」は要約行で必ず見えるようにする（§8.1）。 */
/* 検索部は一覧と同じ幅の帯にして、地続きに見せない（§8.1） */
header{position:sticky;top:0;z-index:20;background:var(--head-bg);
  margin:0 -16px;padding:8px 16px 9px;   /* #app の左右余白ぶんまで広げる */
  border-bottom:2px solid var(--head-line);border-radius:0 0 14px 14px;
  box-shadow:0 8px 18px -10px rgba(0,0,0,.75)}
header #filters{overflow:hidden;max-height:0;opacity:0;
  transition:max-height .14s ease, opacity .12s ease}
header:hover #filters, header:focus-within #filters, header.pin #filters{
  max-height:60vh;opacity:1;overflow-y:auto}
header .summary{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  margin-top:5px;font-size:var(--fs-xxs);color:var(--dim2);min-height:17px}
header:hover .summary, header:focus-within .summary, header.pin .summary{display:none}
header .summary .s-on{color:var(--fg);background:var(--panel2);
  border:1px solid var(--line);border-radius:999px;padding:1px 8px}
header .summary .hint{margin-left:auto;opacity:.75}
/* 畳んでいるときは検索欄も控えめにする */
header #q{padding:5px 10px;font-size:var(--fs-s);transition:padding .14s ease, font-size .14s ease}
header:hover #q, header:focus-within #q, header.pin #q{padding:9px 12px;font-size:var(--fs-lg)}
header .tabs{margin-bottom:5px}
.tabs{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tab{padding:5px 14px;border:1px solid var(--line);border-radius:6px 6px 0 0;
  background:var(--panel);color:var(--dim);cursor:pointer;font-weight:600}
.tab.on{background:var(--panel2);color:var(--fg);border-color:var(--accent)}
.spacer{flex:1}
.ver{color:var(--dim2);font-size:var(--fs-xs)}

.searchrow{display:flex;gap:8px;align-items:center}
#q{flex:1;padding:9px 12px;font-size:var(--fs-lg);background:var(--panel);color:var(--fg);
  border:1px solid var(--line);border-radius:6px;outline:none}
#q:focus{border-color:var(--accent)}
.stat{color:var(--dim2);font-size:var(--fs-xs);white-space:nowrap;min-width:120px;text-align:right}

.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;align-items:center}
.chips .lbl{color:var(--dim2);font-size:var(--fs-xs);margin-right:2px;min-width:38px}
.chip{padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
  color:var(--dim);cursor:pointer;font-size:var(--fs-xs);user-select:none;white-space:nowrap}
.chip:hover{border-color:var(--dim)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-fg);font-weight:600}
.chip .n{opacity:.6;margin-left:4px;font-size:var(--fs-3xs)}
.chip.mini{padding:2px 7px;font-size:var(--fs-3xs)}
.toggle{padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);
  color:var(--dim);cursor:pointer;font-size:var(--fs-xs);user-select:none}
.toggle.on{background:var(--accent2);border-color:var(--accent2);color:var(--on-fg);font-weight:600}
.toggle.off{border-style:dashed;text-decoration:line-through;opacity:.75}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:3px 10px;background:var(--panel);color:var(--dim);border:0;cursor:pointer;
  font-size:var(--fs-xs);font-family:inherit}
.seg button.on{background:var(--accent2);color:var(--on-fg);font-weight:600}

.group{margin-top:18px}
.shead{margin:10px 0 2px;padding:2px 8px;color:var(--dim);font-size:var(--fs-xs);font-weight:600;
  letter-spacing:.04em;border-left:3px solid var(--unique);background:var(--shead-bg);border-radius:0 4px 4px 0}
.shead .cnt{color:var(--dim2);font-weight:400;margin-left:8px}
.ghead{display:flex;align-items:center;gap:8px;cursor:pointer;
  padding:4px 0;border-bottom:1px solid var(--line);margin-bottom:4px}
.ghead h2{margin:0;font-size:var(--fs);letter-spacing:.04em}
.ghead .cnt{color:var(--dim2);font-size:var(--fs-xs)}
.ghead .arrow{color:var(--dim2);font-size:var(--fs-3xs);width:10px}

.row{position:relative;padding:6px 8px;border-radius:6px;border-left:3px solid transparent;
  cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:start}
/* 外部リンクと編集は行の右上。リンクは常時、編集はホバー時だけ出す */
.row .acts{position:absolute;top:5px;right:8px;display:flex;gap:5px;align-items:center}
.row .acts a, .row .acts span{font-size:var(--fs-3xs);color:var(--dim2);text-decoration:none;
  border:1px solid var(--line);border-radius:5px;padding:1px 7px;background:var(--panel2);
  white-space:nowrap;line-height:1.6}
.row .acts a:hover, .row .acts span:hover{color:var(--accent2);border-color:var(--accent2)}
.row .acts .edit{opacity:0;cursor:pointer}
.row:hover .acts .edit, .row.sel .acts .edit{opacity:1}
.row .t{padding-right:150px}
.row.edited > .t .name::after{content:"✎";color:var(--accent2);font-size:var(--fs-3xs);
  margin-left:5px;vertical-align:super}
.row > .ico{grid-row:span 2;align-self:start}
img.ico{width:var(--ico);height:var(--ico);object-fit:contain;
  background:var(--ico-bg);border:1px solid var(--line);border-radius:6px;padding:3px}
img.ico-sm{width:var(--ico-sm);height:var(--ico-sm);object-fit:contain;vertical-align:middle;margin-right:8px;
  background:var(--ico-bg);border:1px solid var(--line);border-radius:5px;padding:2px}
.row .t, .row .lines{grid-column:2}
.row:hover{background:var(--panel)}
.row.sel{background:var(--panel2);border-left-color:var(--accent)}
.row .t{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.name{font-weight:600}
.sub{color:var(--dim);font-size:var(--fs-xs)}
.badge{font-size:var(--fs-badge);padding:1px 6px;border-radius:4px;background:var(--panel2);
  color:var(--dim);border:1px solid var(--line)}
.badge.en{color:var(--dim2)}
.badge.hw{background:var(--hw-bg);color:var(--hw-fg);border-color:var(--hw-line)}
.badge.cult{background:var(--cult-bg);color:var(--cult-fg);border-color:var(--cult-line)}
.badge.uq{background:var(--panel2);color:var(--unique);border-color:var(--line);cursor:pointer}
.badge.uq:hover{border-color:var(--unique)}
.badge.orphan{color:var(--dim2);border-style:dashed}
.badge.vaal{background:var(--vaal-bg);color:var(--vaal-fg);border-color:var(--vaal-line)}
/* 効果は 1 つ 1 項目のリスト、説明文は地の文。見分けが付くように差をつける */
.lines{margin-top:3px}
.lines ul.stats{margin:2px 0;padding:0;list-style:none}
.lines ul.stats li{position:relative;padding-left:14px;color:var(--stat);font-size:var(--fs-s);
  line-height:1.5}
.lines ul.stats li::before{content:"";position:absolute;left:3px;top:.62em;
  width:5px;height:5px;border-radius:1px;background:var(--dim2)}
/* implicit はゲームと同じく上に置き、区切り線と印の色で explicit と分ける */
.lines ul.stats li.imp{color:var(--imp)}
.lines ul.stats li.imp::before{background:var(--imp-dot);border-radius:50%}
.lines ul.stats li.imp-last{padding-bottom:4px;margin-bottom:3px;
  border-bottom:1px dashed var(--line)}
.lines p.prose{margin:2px 0 4px;color:var(--dim);font-size:var(--fs-ss);line-height:1.6;
  padding-left:9px;border-left:2px solid var(--line)}
/* 本文中の用語リンク。下線だけ控えめに引き、押すと解説が出る */
.kw{border-bottom:1px dotted var(--dim2);cursor:help}
.kw:hover{color:var(--accent2);border-bottom-color:var(--accent2)}
#kwpop{position:absolute;z-index:60;display:none;width:min(420px,88vw);max-height:60vh;
  overflow:auto;background:var(--panel);border:1px solid var(--accent2);border-radius:8px;
  box-shadow:0 8px 28px rgba(0,0,0,.5);padding:10px 13px;font-size:var(--fs-s)}
#kwpop.on{display:block}
#kwpop h4{margin:0 0 6px;font-size:var(--fs-xs);color:var(--accent);letter-spacing:.04em}
#kwpop p{margin:0 0 7px;color:var(--dim);line-height:1.65}
#kwpop p:last-of-type{margin-bottom:0}
#kwpop .kwfoot{margin-top:9px;border-top:1px solid var(--line);padding-top:7px;
  display:flex;gap:10px;font-size:var(--fs-3xs)}
#kwpop .kwfoot span{color:var(--accent2);cursor:pointer}
#kwpop .kwfoot span:hover{text-decoration:underline}
mark{background:var(--mark-bg);color:var(--hit);padding:0 1px;border-radius:2px;font-weight:600}

/* 詳細は元の行にぶら下がっていることが分かる程度に、控えめに字下げする */
.detail{position:relative;margin:4px 0 12px 18px;
  padding:10px 14px;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;font-size:var(--fs-s)}
.detail h4{margin:0 0 5px;font-size:var(--fs-xs);color:var(--accent);letter-spacing:.05em}
.detail ul.stats{margin:0;padding:0;list-style:none}
.detail ul.stats li{position:relative;padding-left:14px;margin:1px 0;line-height:1.55}
.detail ul.stats li::before{content:"";position:absolute;left:3px;top:.6em;width:5px;height:5px;
  border-radius:1px;background:var(--dim2)}
.detail p.prose{margin:2px 0;padding-left:9px;border-left:2px solid var(--line);
  color:var(--dim);line-height:1.65}
.detail p.prose.pair{color:var(--dim2);font-size:var(--fs-xs)}
.detail section{margin-bottom:10px}
.detail section:last-child{margin-bottom:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;color:var(--dim)}
.kv b{color:var(--dim2);font-weight:400}
.pair{color:var(--dim2);font-size:var(--fs-xs)}
.slotbtn{cursor:pointer;text-decoration:underline dotted}
.slotbtn:hover{color:var(--accent)}
.arrow-hw{color:var(--hit)}

/* 列幅を宣言どおりにするため fixed。auto だと概要の長文に名前列が潰される */
table.skills{width:100%;border-collapse:collapse;margin-top:10px;font-size:var(--fs-s);
  table-layout:fixed}
table.skills th{text-align:left;color:var(--dim2);font-weight:600;font-size:var(--fs-xs);
  border-bottom:1px solid var(--line);padding:5px 8px;cursor:pointer;white-space:nowrap}
table.skills th.on{color:var(--accent)}
table.skills td{padding:6px 8px;border-bottom:1px solid var(--row-line);vertical-align:top}
/* 名前がアイコンの脇で不自然に折り返さないよう、列幅を決め打ちする */
table.skills th:nth-child(1){width:calc(230px + var(--ico-sm))}
table.skills th:nth-child(2){width:58px}
table.skills th:nth-child(3){width:44px}
table.skills th:nth-child(4){width:250px}
table.skills td:nth-child(1) .namecell{display:flex;align-items:center;gap:8px}
table.skills td:nth-child(1) .namecell .name{line-height:1.35}
table.skills td:nth-child(2){white-space:nowrap}
table.skills tr.g:hover td{background:var(--panel)}
table.skills tr.sel td{background:var(--panel2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.c-r{background:#d05a5a}.c-g{background:#3fa05f}.c-b{background:#4a7ec8}.c-w{background:#9aa0b4}
.tagline{color:var(--dim2);font-size:var(--fs-xxs)}
.more{margin:6px 0;padding:4px 10px;font-size:var(--fs-xs);background:var(--panel);color:var(--dim);
  border:1px solid var(--line);border-radius:6px;cursor:pointer;font-family:inherit}
.empty{color:var(--dim2);padding:40px 0;text-align:center}
.help{color:var(--dim2);font-size:var(--fs-xxs);margin-top:6px}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:0 4px;
  font-size:var(--fs-3xs);font-family:inherit}

/* 設定ウィンドウ（⚙）。変更は即座に反映し、localStorage に保存する */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
#overlay.on{display:block}
#settings{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:51;
  width:min(440px,92vw);max-height:88vh;overflow:auto;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 40px rgba(0,0,0,.45);padding:16px 18px}
#settings.on{display:block}
#settings h3{margin:0 0 12px;font-size:var(--fs);letter-spacing:.04em}
#settings .close{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--dim2);
  font-size:var(--fs-lg);line-height:1}
#settings .close:hover{color:var(--fg)}
#settings .set{display:grid;grid-template-columns:7.5em 1fr auto;gap:8px;align-items:center;
  margin-bottom:11px}
#settings .set > label{color:var(--dim);font-size:var(--fs-xs)}
#settings .set output{color:var(--fg);font-size:var(--fs-xs);min-width:3.6em;text-align:right;
  font-variant-numeric:tabular-nums}
#settings input[type=range]{width:100%;accent-color:var(--accent2)}
#settings .cb{grid-column:2 / -1;display:flex;gap:7px;align-items:flex-start;
  font-size:var(--fs-xs);color:var(--fg);cursor:pointer;line-height:1.5}
#settings .cb input{accent-color:var(--accent2);margin:2px 0 0}
#settings input[type=color]{width:46px;height:26px;padding:0;background:none;
  border:1px solid var(--line);border-radius:5px;cursor:pointer}
#settings .note{color:var(--dim2);font-size:var(--fs-3xs);margin:-6px 0 12px;
  grid-column:1 / -1;line-height:1.5}
#settings .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;
  border-top:1px solid var(--line);padding-top:12px}
#settings .foot button{padding:5px 14px;font-family:inherit;font-size:var(--fs-xs);cursor:pointer;
  background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px}
#settings .foot button.primary{background:var(--accent2);border-color:var(--accent2);
  color:var(--on-fg);font-weight:600}
#settings .preview{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:12px;
  border:1px dashed var(--line);border-radius:8px}
#settings .preview img{width:var(--ico);height:var(--ico);object-fit:contain;
  background:var(--ico-bg);border:1px solid var(--line);border-radius:6px;padding:3px}
#settings .preview .pv-name{font-weight:600}
#settings .preview li{color:var(--stat);font-size:var(--fs-s);list-style:none;
  position:relative;padding-left:14px}
#editor{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:51;
  width:min(680px,94vw);max-height:88vh;overflow:auto;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 40px rgba(0,0,0,.45);padding:16px 18px}
#editor.on{display:block}
#editor h3{margin:0 0 12px;font-size:var(--fs);letter-spacing:.04em}
#editor h3 span{color:var(--dim2);font-weight:400;font-size:var(--fs-xs);margin-left:8px}
#editor .close{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--dim2);
  font-size:var(--fs-lg);line-height:1}
#editor .close:hover{color:var(--fg)}
#editor .ed-row{display:grid;grid-template-columns:6.5em 1fr;gap:8px;align-items:center;
  margin-bottom:9px}
#editor label{color:var(--dim);font-size:var(--fs-xs)}
#editor input[type=text]{width:100%;padding:5px 9px;font-family:inherit;font-size:var(--fs-s);
  background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px}
#editor input[type=text]:focus{outline:none;border-color:var(--accent)}
#editor .ed-line{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;
  margin-bottom:5px}
#editor .ed-line .src{color:var(--dim2);font-size:var(--fs-xs);line-height:1.4}
#editor .ed-line.missing .src{color:var(--hit)}
#editor .hdr{color:var(--accent);font-size:var(--fs-xs);margin:14px 0 6px;
  border-top:1px solid var(--line);padding-top:10px}
#editor .note{color:var(--dim2);font-size:var(--fs-3xs);line-height:1.6;margin-top:12px}
#editor .note code{background:var(--panel2);padding:0 4px;border-radius:3px}
#editor .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;
  border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
#editor .foot button{padding:5px 14px;font-family:inherit;font-size:var(--fs-xs);cursor:pointer;
  background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px}
#editor .foot button.primary{background:var(--accent2);border-color:var(--accent2);
  color:var(--on-fg);font-weight:600}
#settings .preview li::before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;
  border-radius:1px;background:var(--dim2)}
</style>

<div id="app">
  <header>
    <div class="tabs">
      <div class="tab on" data-tab="all">横断検索</div>
      <div class="tab" data-tab="skills">スキル</div>
      <div class="spacer"></div>
      <div class="seg" id="lang">

    <div class="searchrow">

    <input type="range" id="s-w" data-set="width" min="900" max="2400" step="20">
    <output id="o-w"></output>

    <label for="s-accent2">操作色</label>
    <input type="color" id="s-accent2" data-set="accent2">

  </div>

    <label for="s-hwoff">石の拳</label>
    <label class="cb"><input type="checkbox" id="s-hwoff" data-set="hwOff">
      既定で検索から外す</label>
    <div class="note">
      石の拳はマーシャルアーティスト専用の変化です。外すと専用 mod が結果に出ず、
      変化後の文にも検索が当たらなくなります。上の「拳」を押せばその場で戻せます。
    </div>
  </div>
  <div class="set"><div class="note">
    色は今のテーマ（暗 / 明）に対して保存されます。文字色は明るさから自動で決まります。
  </div></div>

    <button data-set="reset">既定に戻す</button>
    <button class="primary" data-set="close">閉じる</button>

<script>
const DATA = __DATA__;
const D = DATA.docs;
const F = {ID:0, KIND:1, SUB:2, SLOTS:3, NEN:4, NJA:5, GEN:6, GJA:7, LINES:8, META:9,
           HAY:10, SORT:11, ICON:12, HAYHW:13};

const KINDS = [
  ['unique','ユニーク','Unique'], ['notable','ノータブル','Notable'],
  ['keystone','キーストーン','Keystone'],
  ['ascendancy','アセンダンシー','Ascendancy'], ['mod','mod','Mod'],
  ['socketable','ソケット','Socketable'], ['gem','ジェム','Gem'],
  ['timeless','タイムレス','Timeless'], ['keyword','用語','Keyword']];

/* 画像: images/ の PNG を見て、無ければ ggpk.exposed に落とす（fetch_images.py と同じ規則） */
const ICON_REMOTE = 'https://image.ggpk.exposed/poe2/Art/';
function iconHTML(d, cls){
  const i = d[F.ICON];
  if (i === undefined || i < 0) return '';
  const p = DATA.icons[i];
  if (!p) return '';
  const local = 'images/' + p.replace(/\.dds$/i, '').replace(/\//g, '_') + '.png';
  const remote = ICON_REMOTE + p + '?format=png';
  return `<img class="${cls}" loading="lazy" src="${local}" alt=""
    onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${remote}'}else{this.style.visibility='hidden'}">`;
}
const KIND_JA = Object.fromEntries(KINDS.map(k => [k[0], k[1]]));
const MOD_SUBS = [['prefix','prefix'],['suffix','suffix'],['corrupted','corrupted'],
  ['essence','essence'],['desecrated','desecrated'],['handwraps','石の拳'],
  ['cultivation','培養'],['unique','ユニーク固有']];
const GEM_SUBS = [['active','スキル'],['support','サポート'],['lineage','リネージュ'],['spirit','スピリット']];
const HIDDEN_SORT = {active:0, support:1, lineage:2, spirit:3};

const SLOT_JA = Object.fromEntries(DATA.slots.map(s => [s.id, s.ja]));
const SLOT_EN = Object.fromEntries(DATA.slots.map(s => [s.id, s.en]));

/* ------------------------------------------------------------------ state */
const st = {tab:'all', q:'', lang:'ja', kinds:new Set(), slots:new Set(), subs:new Set(),
  asc:new Set(), hw:'all', cult:false, gemTypes:new Set(['active']), tags:new Set(),
  color:new Set(), sort:'name', shown:0, open:new Set(), sel:-1, collapsed:new Set(),
  theme:'dark', pin:false, orphan:false};

function norm(s){
  return (s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim();
}

/* query syntax: AND / -exclude / "phrase" / key:value */
const FILTER_KEYS = new Set(['kind','slot','sub','asc','hw','cult','origin','tag','gem','type','color','jewel']);
function parseQuery(text){
  const q = {terms:[], excl:[], filters:{}};
  const tokens = (text||'').match(/-?(?:\w+:)?"[^"]*"|\S+/g) || [];
  for (let tk of tokens){
    let neg = false;
    if (tk[0] === '-'){ neg = true; tk = tk.slice(1); }
    const m = tk.match(/^(\w+):(.*)$/);
    if (m && FILTER_KEYS.has(m[1].toLowerCase())){
      const k = m[1].toLowerCase();
      (q.filters[k] = q.filters[k] || []).push(...m[2].replace(/"/g,'').split(',').map(norm).filter(Boolean));
      continue;
    }
    const v = norm(tk.replace(/"/g,''));
    if (v) (neg ? q.excl : q.terms).push(v);
  }
  return q;
}

function metaTokens(d, key){
  const m = d[F.META];
  switch(key){
    case 'asc': return [m.asc, ...(m.an||[]), ...(m.cl||[])].filter(Boolean).map(norm);
    case 'origin': return [norm(m.origin||'')];
    case 'tag': return [...(m.tags||[]), ...(m.tja||[])].map(norm);
    case 'type': return (m.types||[]).map(norm);
    case 'color': return [norm(m.color||'')];
    case 'jewel': return [norm(m.jewel||'')];
  }
  return [];
}

const HW_OFF = new Set(['off','none','exclude','hide']);
const HW_LABEL = {all:'石の拳変化', only:'石の拳のみ', off:'石の拳を除外'};
const HW_NEXT = {all:'only', only:'off', off:'all'};
/* 石の拳（マーシャルアーティスト専用）を検索から外しているか。
   行ごとに呼ぶので、クエリ文字列が同じ間は結果を使い回す */
let _hwOffFor = null, _hwOffVal = false;
function hwOff(q){
  if (st.hw === 'off') return true;
  if (!q && _hwOffFor === st.q) return _hwOffVal;
  const f = (q || parseQuery(st.q)).filters;
  const v = !!(f.hw && HW_OFF.has(f.hw[0]));
  if (!q){ _hwOffFor = st.q; _hwOffVal = v; }
  return v;
}
function hasHW(d){
  if (d[F.KIND] === 'mod') return !!(d[F.META].hw) || d[F.SUB] === 'handwraps';
  const all = [...(d[F.LINES]||[]), ...((d[F.META].imp)||[])];
  return all.some(l => l[2]);
}
function hasCult(d){
  const m = d[F.META];
  if (d[F.KIND] === 'mod') return !!m.cult || d[F.SUB] === 'cultivation';
  return !!m.cult;
}

function passFilters(d, q){
  const f = q.filters;
  if (st.tab === 'skills'){
    // スキルページは kind=gem 固定。種別・タグ（AND）・色をここで絞る
    if (d[F.KIND] !== 'gem') return false;
    if (st.gemTypes.size && !st.gemTypes.has(d[F.SUB])) return false;
    if (st.color.size && !st.color.has(d[F.META].color)) return false;
    if (st.tags.size){
      const tags = d[F.META].tags || [];
      for (const t of st.tags) if (!tags.includes(t)) return false;
    }
    return true;
  }
  if (st.kinds.size && !st.kinds.has(d[F.KIND])) return false;
  if (f.kind && !f.kind.includes(d[F.KIND])) return false;
  if (st.slots.size && !d[F.SLOTS].some(s => st.slots.has(s))) return false;
  if (f.slot && !d[F.SLOTS].some(s => f.slot.includes(s))) return false;
  if (st.subs.size && !st.subs.has(d[F.SUB])) return false;
  if (f.sub && !f.sub.includes(norm(d[F.SUB]))) return false;
  if (f.gem && (d[F.KIND] !== 'gem' || !f.gem.includes(norm(d[F.SUB])))) return false;
  if (st.asc.size && !(d[F.KIND] === 'ascendancy' && st.asc.has(d[F.META].asc))) return false;
  // 出所（付く装備 / 載るユニーク）が分からない mod は既定で伏せる。件数はチップに出す
  if (!st.orphan && d[F.KIND] === 'mod' && d[F.META].orphan) return false;
  // 石の拳: all=そのまま / only=関係するものだけ / off=専用 mod を出さない
  if (st.hw === 'only' && !hasHW(d)) return false;
  if (hwOff() && d[F.KIND] === 'mod' && d[F.SUB] === 'handwraps') return false;
  if (st.cult && !hasCult(d)) return false;
  if (f.hw && !HW_OFF.has(f.hw[0]) && (f.hw[0] === 'yes') !== hasHW(d)) return false;
  if (f.cult && (f.cult[0] === 'yes') !== hasCult(d)) return false;
  for (const k of ['asc','origin','type','color','jewel']){
    if (f[k]){
      const t = metaTokens(d, k);
      if (!f[k].some(v => t.includes(v))) return false;
    }
  }
  if (f.tag){
    const t = metaTokens(d, 'tag');
    if (!f.tag.every(v => t.includes(v))) return false;
  }
  return true;
}

function score(d, q){
  const names = [norm(d[F.NEN]), norm(d[F.NJA])].filter(Boolean);
  const groups = [norm(d[F.GEN]), norm(d[F.GJA])].filter(Boolean);
  let s = 0;
  for (const t of q.terms){
    if (names.some(n => n === t)) s += 100;
    else if (names.some(n => n.startsWith(t))) s += 60;
    else if (names.some(n => n.includes(t))) s += 40;
    else if (groups.some(g => g.includes(t))) s += 20;
    else s += 5;
  }
  return s;
}

function runSearch(){
  const t0 = performance.now();
  const q = parseQuery(st.q);
  const skipHW = hwOff(q);
  const out = [];
  for (let i = 0; i < D.length; i++){
    const d = D[i];
    // 変化後の文は既定で検索対象。石の拳を外しているときだけ当てない
    const hay = (!skipHW && d[F.HAYHW]) ? d[F.HAY] + ' ' + d[F.HAYHW] : d[F.HAY];
    let ok = true;
    for (const t of q.terms) if (!hay.includes(t)){ ok = false; break; }
    if (ok) for (const e of q.excl) if (hay.includes(e)){ ok = false; break; }
    if (!ok || !passFilters(d, q)) continue;
    out.push(d);
  }
  const rank = Object.fromEntries(KINDS.map((k,n) => [k[0], n]));
  if (q.terms.length){
    const cache = new Map();
    out.sort((a,b) => {
      const ra = rank[a[F.KIND]] - rank[b[F.KIND]];
      if (ra) return ra;
      if (a[F.KIND] === 'unique' && a[F.SORT] !== b[F.SORT]) return a[F.SORT] - b[F.SORT];
      let sa = cache.get(a); if (sa === undefined){ sa = score(a,q); cache.set(a,sa); }
      let sb = cache.get(b); if (sb === undefined){ sb = score(b,q); cache.set(b,sb); }
      if (sa !== sb) return sb - sa;
      return a[F.SORT] - b[F.SORT] || a[F.NEN].localeCompare(b[F.NEN]);
    });
  } else {
    out.sort((a,b) => (rank[a[F.KIND]] - rank[b[F.KIND]]) ||
      (a[F.SORT] - b[F.SORT]) || a[F.NEN].localeCompare(b[F.NEN]));
  }
  st.ms = (performance.now() - t0).toFixed(1);
  st.terms = q.terms;
  return out;
}

/* ----------------------------------------------------------------- render */
function esc(s){
  return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function hl(s){
  let h = esc(s);
  if (!st.terms || !st.terms.length) return h;
  for (const t of st.terms){
    if (t.length < 1) continue;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    h = h.replace(re, m => '' + m + '');
  }
  return h.replace(//g,'<mark>').replace(//g,'</mark>');
}

/* ゲームの本文には `[Stun|スタン]` というリンク記法が残っている。
   用語解説がある鍵だけクリックできるようにし、無い鍵は表示名だけ出す。 */
const KW = new Map();   // KeywordPopups の Id -> doc
const KW_RE = /\[([^\[\]|]+)(?:\|([^\[\]]+))?\]/g;
function buildKeywordIndex(){
  for (const d of D) if (d[F.KIND] === 'keyword') KW.set(d[F.ID].slice(8), d);
}
/** マークアップ入りの本文を、用語リンク + ハイライト済みの HTML にする */
function mk(text, plain){
  const src = text || '';
  const piece = t => plain ? esc(t) : hl(t);
  let out = '', last = 0, m;
  KW_RE.lastIndex = 0;
  while ((m = KW_RE.exec(src)) !== null){
    out += piece(src.slice(last, m.index));
    const key = m[1], label = m[2] || m[1];
    out += KW.has(key)
      ? `<span class="kw" data-kw="${esc(key)}">${piece(label)}</span>`
      : piece(label);
    last = m.index + m[0].length;
  }
  return out + piece(src.slice(last));
}
/** マークアップを落とした素のテキスト（長さの判定や検索語の比較用） */
function plainText(text){
  return (text || '').replace(KW_RE, (_, k, l) => l || k);
}
function pick(en, ja){
  if (st.lang === 'en') return [en || ja, false];
  if (st.lang === 'both'){
    if (ja && en && ja !== en) return [ja + '  /  ' + en, false];
    return [ja || en, !ja && !!en];
  }
  return ja ? [ja, false] : [en || '', !!en];
}
function textCell(en, ja){
  const [txt, isEn] = pick(en, ja);
  if (!txt) return '';
  return mk(txt) + (isEn ? ' <span class="badge en">EN</span>' : '');
}

/* 本文の行。prose = 地の文（説明・概要）、それ以外は効果 1 つ = 1 項目のリスト。
   見分けが付くように描き分けるので、種別をここで決める。 */
/** 今の検索語がこのテキストに当たるか（一致の理由を見せるため） */
function hitsTerm(text){
  if (!st.terms || !st.terms.length) return false;
  const hay = norm(plainText(text || ''));
  return st.terms.some(t => hay.includes(t));
}

function bodyLines(d){
  const k = d[F.KIND], m = d[F.META];
  const stat = l => ({en: l[0], ja: l[1], hw: l[2], cult: l[3]});
  // mod は本文がそのまま名前なので、箇条書きで繰り返さない
  if (k === 'mod') return [];
  if (k === 'gem'){
    const out = [];
    if (m.sum) out.push({en: m.sum[0], ja: m.sum[1], prose: true});
    if (m.desc) out.push({en: m.desc[0], ja: m.desc[1], prose: true});
    for (const x of (m.det || [])){
      if (Array.isArray(x)) out.push(stat(x));
      else if (x.lv){
        const top = Math.max(...x.lv.map(l => l[0]));
        for (const l of x.lv) if (l[0] === top) out.push({en: l[1], ja: l[2]});
      }
    }
    return out;
  }
  if (k === 'socketable'){
    const out = [];
    if (m.desc && (m.desc[0] || m.desc[1]))
      out.push({en: m.desc[0], ja: m.desc[1], prose: true});
    for (const l of (d[F.LINES] || [])) out.push(stat(l));
    return out;
  }
  if (k === 'keyword'){
    // 用語解説は段落。効果のリストではないので地の文で出す
    return (d[F.LINES] || []).map(l => ({en: l[0], ja: l[1], prose: true}));
  }
  if (k === 'unique'){
    // implicit（付与スキルなど）もゲームと同じく explicit の上に出す
    const out = (m.imp || []).map(l => ({...stat(l), imp: true}));
    const n = out.length;
    if (n) out[n - 1].lastImp = true;
    for (const l of (d[F.LINES] || [])) out.push(stat(l));
    return out;
  }
  return (d[F.LINES] || []).map(stat);
}

function slotBadges(ids){
  return ids.filter(s => !['weapon','armour','jewellery'].includes(s))
    .map(s => `<span class="badge slotbtn" data-slot="${s}">` +
      esc(st.lang === 'en' ? SLOT_EN[s] : (SLOT_JA[s] || s)) + '</span>').join('');
}

function rowHTML(d, idx){
  const m = d[F.META];
  const nm = docName(d);
  const name = textCell(nm[0], nm[1]);
  let badges = '';
  if (d[F.GEN] || d[F.GJA]){
    const [g] = pick(d[F.GEN], d[F.GJA]);
    if (g) badges += `<span class="sub">[${hl(g)}]</span>`;
  }
  if (d[F.KIND] === 'unique'){
    if (m.vaal) badges += '<span class="badge vaal">Vaal</span>';
    if (st.cult && m.cult) badges += '<span class="badge cult">培養可</span>';
  }
  if (d[F.KIND] === 'mod' && d[F.SUB] === 'handwraps') badges += '<span class="badge hw">石の拳</span>';
  if (d[F.KIND] === 'mod'){
    for (const u of (m.uq || []).slice(0, 3))
      badges += `<span class="badge uq" data-goto="unique:${esc(u[0])}"
        title="このユニークに載っている">${esc(u[1])}</span>`;
    if ((m.uq || []).length > 3) badges += `<span class="badge">他 ${m.uq.length - 3}</span>`;
    if (m.orphan) badges += '<span class="badge orphan">出所不明</span>';
  }
  if (d[F.KIND] === 'mod' && m.lvl) badges += `<span class="badge">Lv${m.lvl}</span>`;
  if (d[F.KIND] === 'gem' && m.lvl) badges += `<span class="badge">Lv${m.lvl}</span>`;
  const slots = d[F.SLOTS].length ? slotBadges(d[F.SLOTS]) : '';

  let lines = '';
  const ls = bodyLines(d);
  let open = false;   // 効果は <ul> にまとめ、地の文は外に出す
  let li = -1;
  for (const l of ls){
    li++;
    const fixed = lineText(d, li, l.en, l.ja);
    const [txt, isEn] = pick(fixed[0], fixed[1]);
    if (!txt) continue;
    const enTag = isEn ? ' <span class="badge en">EN</span>' : '';
    if (l.prose){
      if (open){ lines += '</ul>'; open = false; }
      lines += `<p class="prose">${mk(txt)}${enTag}</p>`;
      continue;
    }
    let extra = '';
    if (st.cult && l.cult) extra += ' <span class="badge cult">◆</span>';
    if (l.hw && l.hw !== 0){
      const [hwTxt] = pick(l.hw[0], l.hw[1]);
      // 検索語が変化後の文だけに当たっている場合は、トグルに関係なく出す。
      // でないと「なぜこれが出たのか」が見えない
      if (!hwOff() &&
          (st.hw === 'only' || st.open.has(d[F.ID]) || hitsTerm(l.hw[0] + ' ' + l.hw[1])))
        extra += ` <span class="arrow-hw">→ ${mk(hwTxt)}</span>`;
    }
    if (!open){ lines += '<ul class="stats">'; open = true; }
    const cls = [fixed[1] ? 'ja' : '', l.imp ? 'imp' : '', l.lastImp ? 'imp-last' : '']
      .filter(Boolean).join(' ');
    lines += `<li class="${cls}">${mk(txt)}${enTag}${extra}</li>`;
  }
  if (open) lines += '</ul>';

  const detail = st.open.has(d[F.ID]) ? detailHTML(d) : '';
  const ico = iconHTML(d, 'ico');
  const url = poe2dbURL(d);
  const acts = `<div class="acts">`
    + (url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer"
         title="poe2db.tw で開く">poe2db ↗</a>` : '')
    + `<span class="edit" data-edit="${esc(d[F.ID])}" title="訳やリンクを直す">✎</span></div>`;
  return `<div class="row${idx === st.sel ? ' sel' : ''}${editOf(d) ? ' edited' : ''}"
      data-id="${esc(d[F.ID])}" data-idx="${idx}">
    ${ico || '<span></span>'}${acts}
    <div class="t"><span class="name">${name}</span>${badges}${slots}</div>
    <div class="lines">${lines}</div></div>${detail}`;
}

/* poe2db.tw のページ名は英語名から作れる（' ! . , などを落とし、空白を _ に）。
   mod には個別ページが無いので付けない。 */
const POE2DB_KINDS = new Set(['unique','gem','notable','keystone','ascendancy','socketable','timeless']);
function poe2dbURL(d){
  const e = edits[d[F.ID]];
  if (e && e.u !== undefined) return e.u;   // 空文字ならリンクを出さない指定
  if (!POE2DB_KINDS.has(d[F.KIND])) return '';
  const name = d[F.NEN];
  if (!name || name.startsWith('[DNT')) return '';
  const slug = name.replace(/[^0-9A-Za-z \-]/g, '').trim().replace(/\s+/g, '_').replace(/_+/g, '_');
  return slug ? 'https://poe2db.tw/jp/' + encodeURIComponent(slug) : '';
}

/* ------------------------------------------------------------ 手直し（編集）

   訳が無い行や poe2db.tw に届かないリンクを、その場で直せるようにする。
   直した内容は localStorage に貯まり、書き出して overrides.json として
   リポジトリに置けば export_web.py が焼き込む（作り直しても消えない）。   */
let edits = {};
function loadEdits(){
  try { edits = JSON.parse(localStorage.getItem('poe2db.edits') || '{}') || {}; }
  catch (e) { edits = {}; }
  // ビルドに焼き込まれた分を土台にし、手元の編集を上に重ねる
  for (const [id, v] of Object.entries(DATA.overrides || {})){
    edits[id] = {...v, ...(edits[id] || {})};
  }
}
function saveEdits(){
  const own = {};
  for (const [id, v] of Object.entries(edits)){
    const baked = (DATA.overrides || {})[id];
    if (JSON.stringify(v) !== JSON.stringify(baked)) own[id] = v;
  }
  try { localStorage.setItem('poe2db.edits', JSON.stringify(own)); } catch (e) {}
}
const editOf = d => edits[d[F.ID]] || null;
function docName(d){
  const e = editOf(d);
  return [d[F.NEN], (e && e.n) || d[F.NJA]];
}
function lineText(d, i, en, ja){
  const e = editOf(d);
  const o = e && e.l && e.l[i];
  return [en, o || ja];
}

function detailHTML(d){
  const m = d[F.META], k = d[F.KIND];
  let h = '<div class="detail">';
  // 効果はリスト（prose=true で説明の地の文にする）
  const pairs = (title, arr, prose) => {
    if (!arr || !arr.length) return '';
    let s = `<section><h4>${title}</h4>`;
    if (prose){
      for (const l of arr){
        const ja = l[1], en = l[0];
        if (!ja && !en) continue;
        s += `<p class="prose">${mk(ja || en, 1)}</p>`;
        if (ja && en && ja !== en) s += `<p class="prose pair">${mk(en, 1)}</p>`;
      }
      return s + '</section>';
    }
    s += '<ul class="stats">';
    for (const l of arr){
      const ja = l[1], en = l[0];
      s += `<li>${mk(ja || en, 1)}${ja && en && ja !== en ? ` <span class="pair">${mk(en, 1)}</span>` : ''}`;
      if (l[2] && l[2] !== 0) s += ` <span class="arrow-hw">→ ${mk(l[2][1] || l[2][0], 1)}</span>`;
      if (l[3]) s += ' <span class="badge cult">培養で置換可</span>';
      s += '</li>';
    }
    return s + '</ul></section>';
  };

  if (k === 'unique'){
    h += `<section><h4>ベース</h4><div>${esc(m.base[1] || m.base[0])} <span class="pair">${esc(m.base[0])}</span></div></section>`;
    h += pairs('implicit', m.imp);
    h += pairs('性能', d[F.LINES]);
    const info = [];
    if (m.origin) info.push(['起源', m.origin]);
    if (m.vaal) info.push(['培養のオーブ', '対象（Vaal Unique）']);
    if (m.alt) info.push(['別アート', 'あり']);
    if (m.nostats) info.push(['注意', 'PoB に性能定義なし']);
    if (info.length) h += kvSection('情報', info);
  } else if (k === 'mod'){
    h += pairs('本文', [[d[F.NEN], d[F.NJA]]]);
    if (m.from) h += pairs('石の拳で変化する前', [m.from]);
    if (m.hw) h += pairs('石の拳で変化した後', [m.hw]);
    const ap = (m.ap || []).filter(a => a[0]);
    if (ap.length){
      h += '<section><h4>付く装備</h4><div>' + ap.map(a =>
        `<span class="badge slotbtn" data-slot="${a[0]}">${esc(st.lang==='en'?SLOT_EN[a[0]]:SLOT_JA[a[0]]||a[0])}${a[1]>1?` Lv${a[1]}`:''}</span>`
      ).join(' ') + '</div></section>';
    } else if (m.uq && m.uq.length){
      h += '<section><h4>載っているユニーク</h4><div>' + m.uq.map(u =>
        `<span class="badge uq" data-goto="unique:${esc(u[0])}">${esc(u[1])}</span>`
      ).join(' ') + '</div></section>';
    } else {
      h += `<section><h4>出所</h4><div class="pair">特定できず。通常のクラフトでは付かず、
        どのユニークに載っているかも突き止められなかった mod です。</div></section>`;
    }
    const info = [['生成', m.gen], ['必要レベル', String(m.lvl || 1)]];
    if (m.grp) info.push(['グループ', m.grp]);
    if (m.tags) info.push(['タグ', m.tags]);
    if (m.cult) info.push(['培養のオーブ', '置換対象の元 mod']);
    if (m.ess) info.push(['エッセンス', '専用']);
    h += kvSection('情報', info);
  } else if (k === 'gem'){
    if (m.sum) h += pairs('概要', [m.sum], true);
    if (m.desc) h += pairs('説明', [m.desc], true);
    const flat = [], lv = [];
    for (const x of (m.det || [])){
      if (Array.isArray(x)) flat.push(x);
      else if (x.lv) for (const l of x.lv) lv.push(l);
    }
    h += pairs('効果', flat);
    if (lv.length){
      h += '<section><h4>レベル別</h4>';
      for (const l of lv) h += `<div><span class="badge">Lv${l[0]}</span> ${mk(l[2] || l[1], 1)}${l[2] && l[1] ? ` <span class="pair">${mk(l[1], 1)}</span>` : ''}</div>`;
      h += '</section>';
    }
    if (m.tags && m.tags.length){
      h += '<section><h4>タグ</h4><div>' + m.tags.map((t,i) =>
        `<span class="badge slotbtn" data-tag="${esc(t)}">${esc((m.tja && m.tja[i]) || t)}</span>`).join(' ') + '</div></section>';
    }
    const info = [];
    if (m.req && m.req.some(x => x)) info.push(['属性配分', `STR ${m.req[0]}% / DEX ${m.req[1]}% / INT ${m.req[2]}%`]);
    if (m.cast) info.push(['キャスト時間', m.cast + ' ms']);
    if (m.weap && m.weap.length) info.push(['武器制限', m.weap.join(', ')]);
    if (m.rec && m.rec.length) info.push(['推奨サポート', m.rec.join(', ')]);
    if (m.types && m.types.length) info.push(['内部型', m.types.join(', ')]);
    if (info.length) h += kvSection('情報', info);
  } else if (k === 'socketable'){
    for (const e of (m.eff || [])){
      const title = (e.c[1] || e.c[0] || '効果') +
        (e.s && e.s.length ? ` <span class="pair">${e.s.filter(x=>!['weapon','armour','jewellery'].includes(x)).map(x => SLOT_JA[x]||x).join(' / ')}</span>` : '');
      h += pairs(title, e.l);
    }
    if (m.desc && (m.desc[0] || m.desc[1])) h = h.replace('<div class="detail">',
      '<div class="detail">' + pairs('説明', [m.desc], true));
    const info = [['種別', m.type[1] || m.type[0]], ['ティア', m.tier], ['必要レベル', String(m.lvl)]];
    if (m.limit && (m.limit[1] || m.limit[0])) info.push(['制限', m.limit[1] || m.limit[0]]);
    if (m.flags && m.flags.unique_items) info.push(['ユニーク', '装着可']);
    if (m.flags && m.flags.jewellery) info.push(['装飾品', '装着可']);
    h += kvSection('情報', info);
  } else if (k === 'timeless'){
    h += pairs('効果', d[F.LINES]);
    const info = [['ジュエル', m.jn[1] || m.jn[0]], ['種別', d[F.SUB]]];
    if (m.ci) info.push(['変種', `#${m.ci}`]);
    if (m.w) info.push(['抽選重み', String(m.w)]);
    h += kvSection('情報', info);
  } else {
    h += pairs('効果', d[F.LINES]);
    if (k === 'ascendancy'){
      h += kvSection('情報', [['アセンダンシー', m.an[1] || m.an[0]], ['クラス', m.cl[1] || m.cl[0]]]);
    }
    if (m.flav && (m.flav[0] || m.flav[1])){
      h += `<section><h4>フレーバー</h4><div class="pair">${esc(m.flav[1] || m.flav[0])}</div></section>`;
    }
  }
  return h + '</div>';
}
function kvSection(title, pairs){
  return `<section><h4>${title}</h4><div class="kv">` +
    pairs.map(([k,v]) => `<b>${esc(k)}</b><span>${esc(v)}</span>`).join('') + '</div></section>';
}

/* ----------------------------------------------------------------- chips */
function chipHTML(label, on, attr, n){
  return `<span class="chip${on ? ' on' : ''}" ${attr}>${esc(label)}${n !== undefined ? `<span class="n">${n}</span>` : ''}</span>`;
}

function renderFilters(counts){
  if (st.tab === 'skills') return renderSkillFilters();
  let h = '<div class="chips"><span class="lbl">kind</span>';
  h += chipHTML('全て', st.kinds.size === 0, 'data-kind="">');
  for (const [id, ja, en] of KINDS){
    h += chipHTML(st.lang === 'en' ? en : ja, st.kinds.has(id), `data-kind="${id}"`, counts ? (counts[id] || 0) : undefined);
  }
  h += '</div>';

  h += '<div class="chips"><span class="lbl">部位</span>';
  for (const s of DATA.slots){
    if (['weapon','armour','jewellery'].includes(s.id)) continue;
    h += chipHTML(st.lang === 'en' ? s.en : s.ja, st.slots.has(s.id), `data-slot="${s.id}"`);
  }
  h += chipHTML('武器', st.slots.has('weapon'), 'data-slot="weapon"');
  h += '</div>';

  const showMod = !st.kinds.size || st.kinds.has('mod');
  const showAsc = st.kinds.has('ascendancy');
  if (showMod){
    h += '<div class="chips"><span class="lbl">mod</span>';
    for (const [id, ja] of MOD_SUBS) h += chipHTML(ja, st.subs.has(id), `data-sub="${id}"`);
    const n = countOrphans();
    h += `<span class="toggle${st.orphan ? ' on' : ''}" data-toggle="orphan"
      title="付く装備も載るユニークも特定できない mod">出所不明 ${n}</span>`;
    h += '</div>';
  }
  if (showAsc){
    h += '<div class="chips"><span class="lbl">アセ</span>';
    for (const a of DATA.ascendancies){
      if (!a.en) continue;
      h += chipHTML((st.lang === 'en' ? a.en : (a.ja || a.en)), st.asc.has(a.id), `data-asc="${a.id}"`);
    }
    h += '</div>';
  }
  h += `<div class="chips"><span class="lbl"></span>
    <span class="toggle${st.hw === 'only' ? ' on' : (st.hw === 'off' ? ' off' : '')}"
      data-toggle="hw" title="押すたびに 通常 → 石の拳のみ → 石の拳を除外 と切り替わります">拳 ${HW_LABEL[st.hw]}</span>
    <span class="toggle${st.cult ? ' on' : ''}" data-toggle="cult">培 培養のオーブ</span>
    <span class="help">
      <kbd>/</kbd> 検索 <kbd>Esc</kbd> クリア <kbd>↑↓</kbd> 移動 <kbd>Enter</kbd> 詳細 <kbd>1-9</kbd> kind
    </span></div>`;
  return h;
}

/* 畳んでいる間に出す、今かかっている絞り込みの要約 */
function summaryHTML(){
  const on = [];
  const label = (id, list) => (list.find(x => x[0] === id) || [id, id])[1];
  if (st.tab === 'skills'){
    for (const t of st.gemTypes) on.push(label(t, GEM_SUBS));
    for (const c of st.color) on.push({r:'赤', g:'緑', b:'青', w:'白'}[c] || c);
    for (const t of st.tags){
      const i = DATA.gem_tags[t];
      on.push(st.lang === 'en' ? (i ? i.en : t) : ((i && i.ja) || t));
    }
  } else {
    for (const k of st.kinds) on.push(label(k, KINDS.map(x => [x[0], st.lang === 'en' ? x[2] : x[1]])));
    for (const sl of st.slots) on.push(st.lang === 'en' ? SLOT_EN[sl] : (SLOT_JA[sl] || sl));
    for (const sb of st.subs) on.push(label(sb, MOD_SUBS));
    for (const a of st.asc){
      const x = DATA.ascendancies.find(y => y.id === a);
      on.push(x ? (st.lang === 'en' ? x.en : (x.ja || x.en)) : a);
    }
    if (st.hw !== 'all') on.push(HW_LABEL[st.hw]);
    if (st.cult) on.push('培養');
  }
  const chips = on.length
    ? on.map(t => `<span class="s-on">${esc(t)}</span>`).join('')
    : '<span>絞り込みなし</span>';
  return chips + '<span class="hint">↑ ここにマウスを乗せると絞り込みが開きます（📌 で固定）</span>';
}

/* 今の絞り込み条件で伏せられている「出所不明」mod の件数 */
function countOrphans(){
  const q = parseQuery(st.q);
  let n = 0;
  for (const d of D){
    if (d[F.KIND] !== 'mod' || !d[F.META].orphan) continue;
    let ok = true;
    for (const t of q.terms) if (!d[F.HAY].includes(t)){ ok = false; break; }
    if (!ok) continue;
    if (st.kinds.size && !st.kinds.has('mod')) continue;
    if (st.subs.size && !st.subs.has(d[F.SUB])) continue;
    n++;
  }
  return n;
}

function renderSkillFilters(){
  let h = '<div class="chips"><span class="lbl">種別</span>';
  for (const [id, ja] of GEM_SUBS) h += chipHTML(ja, st.gemTypes.has(id), `data-gemtype="${id}"`);
  h += '<span class="lbl" style="margin-left:10px">色</span>';
  for (const [c, ja] of [['r','赤 STR'],['g','緑 DEX'],['b','青 INT'],['w','白']])
    h += chipHTML(ja, st.color.has(c), `data-color="${c}"`);
  h += '</div>';

  // タグ件数は「今の種別・色・検索語と、選択済みタグ」を通ったジェムから数える。
  // 押した結果が何件になるかがそのまま出るので、ゼロ件のタグは並ばない。
  const counts = {};
  const q = parseQuery(st.q);
  for (const d of D){
    if (d[F.KIND] !== 'gem') continue;
    if (st.gemTypes.size && !st.gemTypes.has(d[F.SUB])) continue;
    if (st.color.size && !st.color.has(d[F.META].color)) continue;
    const tags = d[F.META].tags || [];
    let ok = true;
    for (const t of st.tags) if (!tags.includes(t)){ ok = false; break; }
    if (!ok) continue;
    for (const t of q.terms) if (!d[F.HAY].includes(t)){ ok = false; break; }
    if (!ok) continue;
    for (const t of tags) counts[t] = (counts[t] || 0) + 1;
  }
  const tags = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
  h += '<div class="chips"><span class="lbl">タグ</span>';
  for (const t of tags){
    const info = DATA.gem_tags[t];
    h += chipHTML(st.lang === 'en' ? info.en : (info.ja || info.en), st.tags.has(t), `data-tag="${t}"`, counts[t]);
  }
  if (st.tags.size) h += '<span class="toggle" data-toggle="cleartags">クリア</span>';
  h += '</div>';
  return h;
}

/* ---------------------------------------------------------------- output */
function render(){
  const all = runSearch();
  const counts = {};
  for (const d of all) counts[d[F.KIND]] = (counts[d[F.KIND]] || 0) + 1;
  document.getElementById('filters').innerHTML = renderFilters(counts);
  document.getElementById('stat').textContent = `${all.length} 件 / ${st.ms}ms`;
  document.getElementById('summary').innerHTML = summaryHTML();
  st.rows = all;

  const out = document.getElementById('out');
  if (st.tab === 'skills'){ out.innerHTML = renderSkills(all); return; }
  if (!all.length){ out.innerHTML = '<div class="empty">該当なし</div>'; return; }

  // 件数で切らない。多いときだけスクロールに合わせて描き足す（表示上は全件）
  const budget = st.shown || CHUNK;
  let h = '', idx = 0, drawn = 0, truncated = false;
  for (const [kind, ja, en] of KINDS){
    const docs = all.filter(d => d[F.KIND] === kind);
    if (!docs.length) continue;
    const collapsed = st.collapsed.has(kind);
    h += `<div class="group"><div class="ghead" data-group="${kind}">
      <span class="arrow">${collapsed ? '▶' : '▼'}</span>
      <h2 style="color:var(--${kind})">${esc(st.lang === 'en' ? en : ja)}</h2>
      <span class="cnt">${docs.length}</span></div>`;
    if (collapsed){ idx += docs.length; h += '</div>'; continue; }
    let lastSlot = null;
    for (const d of docs){
      if (drawn >= budget){ truncated = true; break; }
      // ユニークは部位ごとの塊にして小見出しを挟む
      if (kind === 'unique'){
        const s0 = d[F.SLOTS][0] || '';
        if (s0 !== lastSlot){
          lastSlot = s0;
          const n = docs.filter(x => (x[F.SLOTS][0] || '') === s0).length;
          const label = s0 ? (st.lang === 'en' ? SLOT_EN[s0] : (SLOT_JA[s0] || s0)) : 'その他';
          h += `<div class="shead">${esc(label)}<span class="cnt">${n}</span></div>`;
        }
      }
      h += rowHTML(d, idx++); drawn++;
    }
    h += '</div>';
    if (truncated) break;
  }
  if (truncated) h += `<div id="sentinel" class="empty">残り ${all.length - drawn} 件を読み込み中…</div>`;
  out.innerHTML = h;
  st.hasMore = truncated;
  // 画面が埋まるまで自動で描き足す（スクロールイベントを待たない）
  if (truncated) requestAnimationFrame(growIfNeeded);
}

/* 件数では切らない。下端に近づいたら描き足すので、表示上は常に全件 */
const CHUNK = 1500;
function growIfNeeded(){
  if (!st.hasMore) return;
  const nearBottom = innerHeight + scrollY >= document.body.scrollHeight - 1200;
  if (!nearBottom) return;
  st.shown = (st.shown || CHUNK) + CHUNK;
  render();
}
addEventListener('scroll', growIfNeeded, {passive: true});
addEventListener('resize', growIfNeeded, {passive: true});

function renderSkills(all){
  const gems = all.filter(d => d[F.KIND] === 'gem');
  const cols = [['name','名前'],['color','色'],['lvl','Lv'],['tags','タグ'],['sum','概要']];
  const sorted = gems.slice().sort((a,b) => {
    if (st.sort === 'lvl') return (a[F.META].lvl||0) - (b[F.META].lvl||0) ||
      a[F.NEN].localeCompare(b[F.NEN]);
    if (st.sort === 'color') return (a[F.META].color||'').localeCompare(b[F.META].color||'') ||
      a[F.NEN].localeCompare(b[F.NEN]);
    return (st.lang === 'en' ? a[F.NEN] : (a[F.NJA] || a[F.NEN]))
      .localeCompare(st.lang === 'en' ? b[F.NEN] : (b[F.NJA] || b[F.NEN]), 'ja');
  });
  if (!sorted.length) return '<div class="empty">該当なし</div>';
  let h = '<table class="skills"><thead><tr>';
  for (const [id, label] of cols)
    h += `<th data-sort="${id}" class="${st.sort === id ? 'on' : ''}">${label}</th>`;
  h += '</tr></thead><tbody>';
  let idx = 0;
  for (const d of sorted){
    const m = d[F.META];
    const open = st.open.has(d[F.ID]);
    h += `<tr class="g${idx === st.sel ? ' sel' : ''}" data-id="${esc(d[F.ID])}" data-idx="${idx}">
      <td><div class="namecell">${iconHTML(d,'ico-sm')}<span class="name">${textCell(d[F.NEN], d[F.NJA])}${m.lin ? ' <span class="badge">リネージュ</span>' : ''}</span></div></td>
      <td><span class="dot c-${m.color || 'w'}"></span>${(m.color || '').toUpperCase()}</td>
      <td>${m.lvl || ''}</td>
      <td class="tagline">${(m.tags || []).map((t,i) => esc(st.lang === 'en' ? t : ((m.tja && m.tja[i]) || t))).join(' ')}</td>
      <td>${textCell((m.sum && m.sum[0]) || (m.desc && m.desc[0]) || '', (m.sum && m.sum[1]) || (m.desc && m.desc[1]) || '')}</td></tr>`;
    if (open) h += `<tr><td colspan="5">${detailHTML(d)}</td></tr>`;
    idx++;
  }
  h += '</tbody></table>';
  return h;
}

/* ------------------------------------------------------------------ hash */
function saveHash(){
  const p = new URLSearchParams();
  if (st.q) p.set('q', st.q);
  if (st.tab !== 'all') p.set('tab', st.tab);
  if (st.lang !== 'ja') p.set('lang', st.lang);
  if (st.kinds.size) p.set('kind', [...st.kinds].join(','));
  if (st.slots.size) p.set('slot', [...st.slots].join(','));
  if (st.subs.size) p.set('sub', [...st.subs].join(','));
  if (st.asc.size) p.set('asc', [...st.asc].join(','));
  if (st.tags.size) p.set('tag', [...st.tags].join(','));
  if (st.color.size) p.set('color', [...st.color].join(','));
  if (st.gemTypes.size !== 1 || !st.gemTypes.has('active')) p.set('gt', [...st.gemTypes].join(','));
  if (st.hw !== 'all') p.set('hw', st.hw === 'off' ? 'off' : '1');
  if (st.orphan) p.set('orphan', '1');
  if (st.cult) p.set('cult', '1');
  if (st.sort !== 'name') p.set('sort', st.sort);
  if (st.theme !== 'dark') p.set('theme', st.theme);
  const s = p.toString();
  history.replaceState(null, '', s ? '#' + s : location.pathname);
}
function loadHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  st.q = p.get('q') || '';
  st.tab = p.get('tab') || 'all';
  st.lang = p.get('lang') || 'ja';
  const set = (k, target) => { const v = p.get(k); if (v) target.clear(), v.split(',').forEach(x => target.add(x)); };
  set('kind', st.kinds); set('slot', st.slots); set('sub', st.subs);
  set('asc', st.asc); set('tag', st.tags); set('color', st.color);
  if (p.get('gt')) set('gt', st.gemTypes);
  const hwParam = p.get('hw');
  st.hw = hwParam === '1' ? 'only' : (HW_OFF.has(hwParam || '') ? 'off'
          : (ui.hwOff ? 'off' : 'all'));
  st.orphan = p.get('orphan') === '1';
  st.cult = p.get('cult') === '1';
  st.sort = p.get('sort') || 'name';
  let savedTheme = null, savedPin = null;
  try { savedTheme = localStorage.getItem('poe2db.theme'); savedPin = localStorage.getItem('poe2db.pin'); } catch (e) {}
  st.theme = p.get('theme') || savedTheme || 'dark';
  st.pin = savedPin === '1';
  applyTheme();
  for (const b of document.querySelectorAll('#theme button')) b.classList.toggle('on', b.dataset.theme === st.theme);
  document.getElementById('q').value = st.q;
  for (const b of document.querySelectorAll('#lang button')) b.classList.toggle('on', b.dataset.lang === st.lang);
  for (const t of document.querySelectorAll('.tab')) t.classList.toggle('on', t.dataset.tab === st.tab);
}

/* ---------------------------------------------------------------- events */
/* ---------------------------------------------------------------- 設定 */
const UI_DEFAULT = {ico:64, icoSm:38, fs:14, width:1180, hwOff:false};
const ACCENT_DEFAULT = {
  dark:  {accent:'#c8a45c', accent2:'#7aa2f7'},
  light: {accent:'#8a6410', accent2:'#2350a8'},
};
let ui = {...UI_DEFAULT, dark:{...ACCENT_DEFAULT.dark}, light:{...ACCENT_DEFAULT.light}};

/* 背景色の明るさから、その上に載せる文字色を決める（コントラストを自動で確保する） */
function readableOn(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return '#ffffff';
  const n = parseInt(m[1], 16);
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => {
    const c = v / 255;
    return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
  });
  return (.2126 * r + .7152 * g + .0722 * b) > .42 ? '#14161c' : '#ffffff';
}

function applyUI(){
  const s = document.documentElement.style;
  s.setProperty('--ico', ui.ico + 'px');
  s.setProperty('--ico-sm', ui.icoSm + 'px');
  s.setProperty('--fs', ui.fs + 'px');
  s.setProperty('--app-w', ui.width + 'px');
  const c = ui[st.theme] || ACCENT_DEFAULT[st.theme];
  s.setProperty('--accent', c.accent);
  s.setProperty('--accent2', c.accent2);
  s.setProperty('--unique', c.accent);
  // アクセント上の文字色は明るさから決める。濃い色を選んでも読めなくならない
  s.setProperty('--on-fg', readableOn(c.accent2));
  try { localStorage.setItem('poe2db.ui', JSON.stringify(ui)); } catch (e) {}
}

function loadUI(){
  try {
    const raw = localStorage.getItem('poe2db.ui');
    if (raw){
      const got = JSON.parse(raw);
      ui = {...ui, ...got,
            dark: {...ACCENT_DEFAULT.dark, ...(got.dark || {})},
            light: {...ACCENT_DEFAULT.light, ...(got.light || {})}};
    }
  } catch (e) {}
}

function syncSettingsUI(){
  const c = ui[st.theme] || ACCENT_DEFAULT[st.theme];
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.value = v; };
  set('s-ico', ui.ico); set('s-icosm', ui.icoSm); set('s-fs', ui.fs); set('s-w', ui.width);
  set('s-accent', c.accent); set('s-accent2', c.accent2);
  const cb = document.getElementById('s-hwoff');
  if (cb) cb.checked = !!ui.hwOff;
  document.getElementById('o-ico').textContent = ui.ico + 'px';
  document.getElementById('o-icosm').textContent = ui.icoSm + 'px';
  document.getElementById('o-fs').textContent = ui.fs + 'px';
  document.getElementById('o-w').textContent = ui.width + 'px';
  // 見本のアイコンは実データから 1 つ借りる
  const sample = D.find(d => d[F.KIND] === 'unique' && d[F.ICON] >= 0);
  const img = document.getElementById('pv-img');
  if (sample && img && !img.src){
    const p = DATA.icons[sample[F.ICON]];
    img.src = 'images/' + p.replace(/\.dds$/i, '').replace(/\//g, '_') + '.png';
    img.onerror = () => { img.onerror = null; img.src = ICON_REMOTE + p + '?format=png'; };
  }
}

/* 用語解説のポップアップ。解説の中の用語も辿れる */
function showKeyword(key, anchor){
  const d = KW.get(key);
  const pop = document.getElementById('kwpop');
  if (!d){ pop.classList.remove('on'); return; }
  const [en, ja] = [d[F.NEN], d[F.NJA]];
  const title = st.lang === 'en' ? en : (ja || en);
  let h = `<h4>${esc(title)}${ja && en && st.lang !== 'en'
    ? ` <span class="pair">${esc(en)}</span>` : ''}</h4>`;
  for (const l of (d[F.LINES] || [])){
    const [txt] = pick(l[0], l[1]);
    if (txt) h += `<p>${mk(txt, 1)}</p>`;
  }
  h += `<div class="kwfoot"><span data-kwsearch="${esc(key)}">この用語だけ一覧する</span>
    <span data-kwclose="1">閉じる</span></div>`;
  pop.innerHTML = h;
  pop.classList.add('on');
  // 画面からはみ出さない位置に置く
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, hgt = pop.offsetHeight;
  let left = r.left + scrollX;
  let top = r.bottom + scrollY + 6;
  if (left + w > scrollX + innerWidth - 12) left = scrollX + innerWidth - w - 12;
  if (left < scrollX + 8) left = scrollX + 8;
  if (r.bottom + hgt + 20 > innerHeight) top = r.top + scrollY - hgt - 6;
  pop.style.left = left + 'px';
  pop.style.top = Math.max(scrollY + 4, top) + 'px';
}
function hideKeyword(){ document.getElementById('kwpop').classList.remove('on'); }

/* 編集ダイアログ */
let edTarget = null;
function openEditor(id){
  edTarget = D.find(d => d[F.ID] === id);
  if (!edTarget) return;
  const d = edTarget, e = edits[id] || {};
  document.getElementById('ed-target').textContent =
    `${KIND_JA[d[F.KIND]] || d[F.KIND]} / ${d[F.NEN]}`;
  document.querySelector('label[for="ed-name"]').textContent =
    d[F.KIND] === 'mod' ? '本文の訳' : '日本語名';
  document.getElementById('ed-name').value = e.n || d[F.NJA] || '';
  document.getElementById('ed-name').placeholder = plainText(d[F.NJA]) || '（訳なし）';
  document.getElementById('ed-url').value = e.u !== undefined ? e.u : '';
  const auto = POE2DB_KINDS.has(d[F.KIND]) ? poe2dbURL(d) : '';
  document.getElementById('ed-url').placeholder = auto || 'このページは無し';

  // 行ごとの訳。訳が無い行は印を付けて先に気付けるようにする
  const ls = bodyLines(d);
  let h = ls.length ? '<div class="hdr">本文（左が英語。右に訳を入れる）</div>' : '';
  ls.forEach((l, i) => {
    const cur = (e.l && e.l[i]) || l.ja || '';
    h += `<div class="ed-line${l.ja ? '' : ' missing'}">
      <div class="src">${esc(plainText(l.en))}</div>
      <input type="text" data-line="${i}" value="${esc(cur)}"
        placeholder="${esc(l.ja || '（訳なし）')}" spellcheck="false"></div>`;
  });
  document.getElementById('ed-lines').innerHTML = h;
  document.getElementById('overlay').classList.add('on');
  document.getElementById('editor').classList.add('on');
}
function closeEditor(){
  document.getElementById('editor').classList.remove('on');
  document.getElementById('overlay').classList.remove('on');
  edTarget = null;
}
function collectEdit(){
  if (!edTarget) return;
  const d = edTarget, id = d[F.ID];
  const rec = {};
  const name = document.getElementById('ed-name').value.trim();
  if (name && name !== d[F.NJA]) rec.n = name;
  const url = document.getElementById('ed-url').value.trim();
  if (url === '-') rec.u = '';                       // リンクを消す指定
  else if (url) rec.u = url;
  const ls = bodyLines(d), lines = {};
  document.querySelectorAll('#ed-lines input[data-line]').forEach(inp => {
    const i = +inp.dataset.line, v = inp.value.trim();
    if (v && v !== (ls[i] && ls[i].ja)) lines[i] = v;
  });
  if (Object.keys(lines).length) rec.l = lines;
  if (Object.keys(rec).length) edits[id] = rec; else delete edits[id];
  saveEdits();
  render();
}
function exportEdits(){
  const own = {};
  for (const [id, v] of Object.entries(edits)){
    const baked = (DATA.overrides || {})[id];
    if (JSON.stringify(v) !== JSON.stringify(baked)) own[id] = v;
  }
  const blob = new Blob([JSON.stringify(own, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'overrides.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function openSettings(on){
  document.getElementById('overlay').classList.toggle('on', on);
  document.getElementById('settings').classList.toggle('on', on);
  if (on) syncSettingsUI();
}

function applyTheme(){
  document.documentElement.dataset.theme = st.theme;
  applyUI();   // 色はテーマごとに持つので、切り替えたら入れ直す
  document.querySelector('header').classList.toggle('pin', st.pin);
  document.querySelector('[data-toggle="pin"]').classList.toggle('on', st.pin);
  try { localStorage.setItem('poe2db.theme', st.theme); localStorage.setItem('poe2db.pin', st.pin ? '1' : ''); } catch (e) {}
}
function toggle(set, v){ set.has(v) ? set.delete(v) : set.add(v); }
function refresh(){ st.shown = CHUNK; saveHash(); render(); }

document.getElementById('q').addEventListener('input', e => {
  st.q = e.target.value; st.sel = -1;
  clearTimeout(window._t); window._t = setTimeout(refresh, 50);
});
document.addEventListener('click', e => {
  // `[data-theme]` は <html> にも付くので、セレクタは #theme button に限定する
  if (e.target.closest('a[href]')) return;   // 外部リンクはそのまま開かせる
  // 用語リンク → 解説を出す。行の開閉には伝播させない
  const kwEl = e.target.closest('.kw');
  if (kwEl){ e.stopPropagation(); showKeyword(kwEl.dataset.kw, kwEl); return; }
  const inPop = e.target.closest('#kwpop');
  if (inPop){
    const sEl = e.target.closest('[data-kwsearch]');
    if (sEl){
      const d = KW.get(sEl.dataset.kwsearch);
      hideKeyword();
      if (d){ st.kinds = new Set(['keyword']); st.q = plainText(d[F.NJA] || d[F.NEN]);
              document.getElementById('q').value = st.q; refresh(); }
    }
    if (e.target.closest('[data-kwclose]')) hideKeyword();
    return;
  }
  hideKeyword();
  const t = e.target.closest('[data-kind],[data-slot],[data-sub],[data-asc],[data-toggle],[data-group],[data-tab],[data-lang],[data-gemtype],[data-color],[data-tag],[data-sort],[data-set],[data-edit],[data-ed],[data-goto],#theme button,.row,tr.g');
  if (!t) return;
  const ds = t.dataset;
  if (ds.edit !== undefined){ openEditor(ds.edit); return; }
  if (ds.ed !== undefined){
    if (ds.ed === 'close'){ collectEdit(); closeEditor(); }
    else if (ds.ed === 'clear'){
      if (edTarget){ delete edits[edTarget[F.ID]]; saveEdits(); const id = edTarget[F.ID];
        closeEditor(); render(); openEditor(id); }
    }
    else if (ds.ed === 'export'){ collectEdit(); exportEdits(); }
    else if (ds.ed === 'import'){ document.getElementById('ed-file').click(); }
    return;
  }
  if (ds.tab !== undefined){ st.tab = ds.tab; st.sel = -1;
    for (const x of document.querySelectorAll('.tab')) x.classList.toggle('on', x === t);
    return refresh(); }
  if (t.matches('#theme button')){ st.theme = ds.theme; applyTheme();
    for (const x of document.querySelectorAll('#theme button')) x.classList.toggle('on', x === t);
    return refresh(); }
  if (ds.toggle === 'pin'){ st.pin = !st.pin; applyTheme(); return refresh(); }
  if (ds.toggle === 'settings'){ openSettings(true); return; }
  if (ds.set === 'close'){ openSettings(false); return; }
  if (ds.set === 'reset'){
    ui = {...UI_DEFAULT, dark:{...ACCENT_DEFAULT.dark}, light:{...ACCENT_DEFAULT.light}};
    applyUI(); syncSettingsUI(); return;
  }
  if (ds.lang !== undefined){ st.lang = ds.lang;
    for (const x of document.querySelectorAll('#lang button')) x.classList.toggle('on', x === t);
    return refresh(); }
  if (ds.kind !== undefined){ ds.kind === '' ? st.kinds.clear() : toggle(st.kinds, ds.kind); return refresh(); }
  if (ds.slot !== undefined){ toggle(st.slots, ds.slot); return refresh(); }
  if (ds.sub !== undefined){ toggle(st.subs, ds.sub); return refresh(); }
  if (ds.asc !== undefined){ toggle(st.asc, ds.asc); return refresh(); }
  if (ds.gemtype !== undefined){ toggle(st.gemTypes, ds.gemtype); return refresh(); }
  if (ds.color !== undefined){ toggle(st.color, ds.color); return refresh(); }
  if (ds.tag !== undefined){
    if (st.tab !== 'skills'){ st.tab = 'skills';
      for (const x of document.querySelectorAll('.tab')) x.classList.toggle('on', x.dataset.tab === 'skills'); }
    toggle(st.tags, ds.tag); return refresh(); }
  if (ds.sort !== undefined){ st.sort = ds.sort; return refresh(); }
  if (ds.toggle === 'hw'){ st.hw = HW_NEXT[st.hw] || 'all'; return refresh(); }
  if (ds.toggle === 'cult'){ st.cult = !st.cult; return refresh(); }
  if (ds.toggle === 'cleartags'){ st.tags.clear(); return refresh(); }
  if (ds.toggle === 'orphan'){ st.orphan = !st.orphan; return refresh(); }
  if (ds.goto !== undefined){
    // mod からそれが載っているユニークへ飛ぶ
    const target = D.find(x => x[F.ID] === ds.goto);
    if (target){
      st.kinds = new Set(['unique']); st.subs.clear(); st.slots.clear();
      st.q = plainText(target[F.NJA] || target[F.NEN]);
      document.getElementById('q').value = st.q;
      st.open.add(target[F.ID]);
      refresh(); window.scrollTo(0, 0);
    }
    return;
  }
  if (ds.group !== undefined){ toggle(st.collapsed, ds.group); return render(); }
  if (ds.id !== undefined){
    st.open.has(ds.id) ? st.open.delete(ds.id) : st.open.add(ds.id);
    st.sel = +ds.idx;
    return render();
  }
});
document.getElementById('overlay').addEventListener('click', () => {
  if (document.getElementById('editor').classList.contains('on')){ collectEdit(); closeEditor(); }
  openSettings(false);
});
document.getElementById('ed-file').addEventListener('change', ev => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const got = JSON.parse(r.result);
      let n = 0;
      for (const [id, v] of Object.entries(got)){ edits[id] = v; n++; }
      saveEdits(); render();
      alert(`${n} 件を読み込みました。`);
    } catch (err) { alert('JSON として読めませんでした: ' + err); }
  };
  r.readAsText(f);
  ev.target.value = '';
});
document.getElementById('settings').addEventListener('input', e => {
  const key = e.target.dataset.set;
  if (!key) return;
  if (key === 'accent' || key === 'accent2'){
    (ui[st.theme] = ui[st.theme] || {})[key] = e.target.value;
  } else if (e.target.type === 'checkbox'){
    ui[key] = e.target.checked;
    // 既定を変えたら、今の表示にもその場で効かせる
    if (key === 'hwOff'){ st.hw = ui.hwOff ? 'off' : 'all'; applyUI(); return refresh(); }
  } else {
    ui[key] = +e.target.value;
  }
  applyUI(); syncSettingsUI();
});

document.addEventListener('keydown', e => {
  const inBox = document.activeElement === document.getElementById('q');
  if (e.key === '/' && !inBox){ e.preventDefault(); document.getElementById('q').focus(); return; }
  if (e.key === 'Escape'){
    if (document.getElementById('kwpop').classList.contains('on')){ hideKeyword(); return; }
    if (document.getElementById('editor').classList.contains('on')){
      collectEdit(); closeEditor(); return;
    }
    if (document.getElementById('settings').classList.contains('on')){
      openSettings(false); return;
    }
    if (inBox && st.q){ st.q = ''; document.getElementById('q').value = ''; refresh(); }
    else document.getElementById('q').blur();
    return;
  }
  if (inBox && ['ArrowDown','ArrowUp','Enter'].includes(e.key) === false) return;
  const rows = st.tab === 'skills' ? document.querySelectorAll('tr.g') : document.querySelectorAll('.row');
  if (e.key === 'ArrowDown'){ e.preventDefault(); st.sel = Math.min(st.sel + 1, rows.length - 1); render(); scrollSel(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); st.sel = Math.max(st.sel - 1, 0); render(); scrollSel(); }
  else if (e.key === 'Enter' && st.sel >= 0){
    const el = rows[st.sel]; if (!el) return;
    const id = el.dataset.id;
    st.open.has(id) ? st.open.delete(id) : st.open.add(id);
    render(); scrollSel();
  } else if (!inBox && /^[1-9]$/.test(e.key)){
    toggle(st.kinds, KINDS[+e.key - 1][0]); refresh();
  }
});
function scrollSel(){
  const el = document.querySelector('.row.sel, tr.sel');
  if (el) el.scrollIntoView({block:'nearest'});
}
window.addEventListener('hashchange', () => { loadHash(); render(); });

buildKeywordIndex();
loadUI();
loadEdits();
loadHash();   // applyTheme() の中で applyUI() が走る
render();
</script>
